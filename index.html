<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divvy — Split Expense</title>
<style>
  :root{--brand:#5E17EB;--brand2:#8B5CF6;--ink:#15171A;--muted:#5b5b66;--bg:#ffffff}
  @media (prefers-color-scheme: dark){:root{--ink:#f4f3f8;--muted:#b3b1c0;--bg:#141018}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,"Segoe UI",Roboto,"Comfortaa",system-ui,sans-serif;
       background:radial-gradient(1200px 600px at 50% -10%,var(--brand2),var(--brand));color:#fff;text-align:center}
  .card{padding:40px 26px}
  .logo{width:84px;height:84px;border-radius:22px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:46px;margin:0 auto 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  h1{font-size:34px;letter-spacing:-.6px;margin:0 0 6px}
  p{opacity:.9;font-size:17px;margin:0 0 26px}
  .links a{display:inline-block;margin:6px;padding:12px 22px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-weight:700;backdrop-filter:blur(6px)}
  .links a:hover{background:rgba(255,255,255,.28)}
  footer{margin-top:30px;opacity:.75;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">D</div>
    <h1>Divvy</h1>
    <p>Split expenses with friends — no spreadsheets, no awkward math.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </div>
    <footer>© 2026 Divvy — Split Expense</footer>
  </div>
</body>
</html>
